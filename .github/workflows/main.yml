name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-check:
    name: Windows integrated check
    runs-on: windows-2025
    timeout-minutes: 45

    permissions:
      contents: read
      pages: read

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/whitebase-app/package-lock.json

      - name: Show environment
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          dotnet --info

      - name: Setup Whitebase
        shell: cmd
        run: scripts\ops.bat setup

      - name: Run integrated check
        shell: cmd
        run: scripts\ops.bat check

      - name: Build Windows Control Center release
        shell: pwsh
        run: cargo build --release --locked -p whitebase-control-center

      - name: Upload Windows Control Center
        uses: actions/upload-artifact@v6
        with:
          name: whitebase-control-center-windows-x86_64
          path: target/release/whitebase-control-center.exe
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Build GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        env:
          WHITEBASE_WEB_BASE: "${{ steps.pages.outputs.base_path }}/"
        run: scripts\ops.bat web-build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/whitebase-app/dist

  linux-check:
    name: Linux workspace and Control Center
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Show environment
        run: |
          rustc --version
          cargo --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Build Linux Control Center release
        run: cargo build --release --locked -p whitebase-control-center

      - name: Package Linux Control Center
        run: |
          tar -czf whitebase-control-center-linux-x86_64.tar.gz \
            -C target/release \
            whitebase-control-center

      - name: Upload Linux Control Center
        uses: actions/upload-artifact@v6
        with:
          name: whitebase-control-center-linux-x86_64
          path: whitebase-control-center-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy-pages:
    name: Deploy GitHub Pages
    needs:
      - integrated-check
      - linux-check

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5