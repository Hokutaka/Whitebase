name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows-check:
    name: Windows integrated check
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/whitebase-app/package-lock.json

      - name: Setup MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Show environment
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version
          dotnet --info

      - name: Setup Whitebase
        shell: cmd
        run: scripts\ops.bat setup

      - name: Check Windows GNU native backends
        shell: pwsh
        env:
          WHITEBASE_UCRT64_BIN: '${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin'
        run: .\scripts\windows-gnu-native.ps1 check

      - name: Run integrated check
        shell: cmd
        run: scripts\ops.bat check

  linux-check:
    name: Linux workspace check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            cmake \
            nasm \
            pkg-config \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      - name: Show environment
        run: |
          rustc --version
          cargo --version
          g++ --version
          cmake --version
          nasm -v

      - name: Check Linux native backends
        run: bash scripts/linux-native.sh check

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  android-check:
    name: Android ARM64 build check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/whitebase-app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK / NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add wasm32-unknown-unknown

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-aarch64

      - name: Install frontend dependencies
        working-directory: apps/whitebase-app
        run: npm ci

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build frontend WASM package
        run: |
          wasm-pack build crates/interface/whitebase-wasm \
            --target web \
            --dev \
            --out-dir "$GITHUB_WORKSPACE/apps/whitebase-app/src/wasm"

      - name: Show Android environment
        run: |
          java -version
          rustc --version
          cargo --version
          node --version
          npm --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$NDK_HOME"

      - name: Build Android ARM64 debug APK
        working-directory: apps/whitebase-app
        run: npm run tauri android build -- --debug --apk --target aarch64

      - name: Validate Android APK
        run: |
          apk="$(find apps/whitebase-app/src-tauri/gen/android \
            -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' \
            -print -quit)"

          test -n "$apk"
          echo "Android APK: $apk"

      - name: Upload Android ARM64 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: whitebase-app-android-arm64-debug
          path: apps/whitebase-app/src-tauri/gen/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  windows-package:
    name: Windows release package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows-check
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/whitebase-app/package-lock.json

      - name: Setup MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Setup Whitebase
        shell: cmd
        run: scripts\ops.bat setup

      - name: Build Windows GNU native backends release
        shell: pwsh
        env:
          WHITEBASE_UCRT64_BIN: '${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin'
        run: .\scripts\windows-gnu-native.ps1 release

      - name: Build Windows Control Center release
        shell: pwsh
        run: cargo build --release --locked -p whitebase-control-center

      - name: Validate Windows release package
        shell: pwsh
        run: |
          $requiredFiles = @(
            "target/release/whitebase-control-center.exe",
            "target/release/whitebase_windows_gnu_native.dll"
          )

          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release artifact was not found: $path"
            }
          }

      - name: Upload Windows Control Center
        uses: actions/upload-artifact@v7
        with:
          name: whitebase-control-center-windows-x86_64
          path: |
            target/release/whitebase-control-center.exe
            target/release/whitebase_windows_gnu_native.dll
          if-no-files-found: error
          retention-days: 7

  linux-package:
    name: Linux release package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - linux-check
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            cmake \
            nasm \
            pkg-config \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      - name: Build Linux native backends release
        run: bash scripts/linux-native.sh release

      - name: Build Linux Control Center release
        run: cargo build --release --locked -p whitebase-control-center

      - name: Package Linux Control Center
        run: |
          tar -czf whitebase-control-center-linux-x86_64.tar.gz \
            -C target/release \
            whitebase-control-center

      - name: Upload Linux Control Center
        uses: actions/upload-artifact@v7
        with:
          name: whitebase-control-center-linux-x86_64
          path: whitebase-control-center-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  pages-build:
    name: Build GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 30

    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/whitebase-app/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Whitebase
        shell: cmd
        run: scripts\ops.bat setup

      - name: Build GitHub Pages
        shell: cmd
        env:
          WHITEBASE_WEB_BASE: "${{ steps.pages.outputs.base_path }}/"
        run: scripts\ops.bat web-build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/whitebase-app/dist

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows-check
      - linux-check
      - pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5