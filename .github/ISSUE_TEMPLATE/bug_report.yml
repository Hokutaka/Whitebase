name: Bug report
description: Whitebaseで発生した不具合を報告します
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。
        再現方法や実行環境を、分かる範囲で入力してください。

  - type: textarea
    id: summary
    attributes:
      label: 不具合の概要
      description: 何が起きたかを簡潔に記載してください。
      placeholder: 例：Run Serverを停止してもプロセスが残る
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 不具合を再現するための手順を記載してください。
      placeholder: |
        1. Whitebase Control Centerを起動する
        2. Run Serverを押す
        3. Stopを押す
        4. プロセスを確認する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どう動くべきだったかを記載してください。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に起きた動作やエラーメッセージを記載してください。
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
        - その他
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OSバージョン
      placeholder: 例：Windows 11 24H2 / Zorin OS 17
    validations:
      required: true

  - type: input
    id: whitebase-version
    attributes:
      label: Whitebaseのバージョンまたはコミット
      placeholder: 例：0.1.0 / abc1234

  - type: textarea
    id: logs
    attributes:
      label: ログ
      description: 関連するログやスタックトレースを貼り付けてください。
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: 補足情報
      description: スクリーンショットなど、追加情報があれば記載してください。

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 同じ内容のIssueがないことを確認しました
          required: true
        - label: 秘密鍵、トークン、個人情報をログに含めていません
          required: true
