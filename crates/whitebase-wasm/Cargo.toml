[package]
name = "whitebase-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
whitebase-core = {
    path = "../whitebase-core"
}
whitebase-runner = {
    path = "../whitebase-runner"
}
wasm-bindgen = "0.2"
serde = {
    version = "1",
    features = ["derive"]
}
serde-wasm-bindgen = "0.6"